<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body>

    <style>
        *{
    margin: 0;
    font-family: Arial;
    border: border-box;
}


.navbar{
        height: 60px;    
        background-color: #0f1111;
        color: white;
        display: flex;
}

.nav-logo {
    height:50px;
    width: 100px;
}

.logo{
    background-image: url("amazon-logo.png");
    background-size: cover;
    height: 50px;
    width: 100%;
}

.border{
    border: 1.5px solid transparent
}

.add-icon{
    display: flex;
    align-items: center;
}

.nav-search {
    display: flex;
    justify-content:center ;
    background-color: pink;
    width: 620px;
    height: 40px;
    border-radius: 4px;
}

.search-search{
    background-color: #f3f3f3;
    width: 50px;
    text-align: center;
    border-top-left-radius: 4px;
    border-bottom-left-radius: 4px;
}

.panel-ops{
    width: 70%;
    font-weight: 700;
    
}
    </style>

    <div class="navbar">
    <div class="nav-logo">
    <div class="logo"></div>
    </div>
    <div class="nav-address">
        <p class="add-first">Deliver to</p>
        <div class="nav-logo border">
            <div class="add-icon">
                <i class="fa-solid fa-location-dot"></i>
                <p class="add-sec">India</p>
    </div>
        </div>
        <div class="nav-search">
            <select>
        
                <input placeholder="Search Amazon">
            <div class="search-icon"></div>
        </div>
        <div class="panel">
            ALL
        </div>
    </div>
    </div>
        <div class="panel-ops">
            <p>Best sellers</p>
            <p> Mobiles</p>
            <p>Customer Services</p>
            <p>Today's Deals</p>
            <p>Fashion</p>
            <p>Electronic</p>
            <p>Books</p>
            <p>Prime<select></select> 
            <p>New Releases</p>
            <p>Home and kitchen</p> 
            <p>Amazon Pay</p>
        </div>
    </div>
    <div class="shop-section">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>    
        <div class="box4"></div>
        <div class="flexbox-container">
            <div class="flexbox-item flexbox-item-1"></div>
            <div class="flexbox-item flexbox-item-2"></div>
            <div class="flexbox-item flexbox-item-3"></div>
    
    

</body>

</html>
